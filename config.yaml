app:
  name: "dungeon2_bot"
  log_level: "INFO"
  data_dir: "./data"
  captures_dir: "./data/captures"
  temp_dir: "./data/tmp"

adb:
  device_serial: "127.0.0.1:5555"
  command_timeout_s: 15.0
  connect_timeout_s: 10.0
  adb_path: ""
  post_tap_delay_ms: 250
  post_swipe_delay_ms: 400
  post_keyevent_delay_ms: 200

screen:
  expected_width: 1280
  expected_height: 720
  capture_format: "png"
  rotation: 0

motion:
  stable_frames: 3
  stable_diff_threshold: 2.5
  stable_poll_ms: 250
  stable_timeout_s: 8.0
  max_stable_retries: 2
  downscale_size: [64, 36]

matching:
  default_threshold: 0.90
  classify_threshold: 0.90
  method: "TM_CCOEFF_NORMED"
  grayscale: true

teacher:
  pause_hotkey: "space"
  knowledge_dir: "./data/knowledge"
  save_unknown_frames: true
  unknown_dir: "./data/knowledge/unknown"

safety:
  block_purchases: true
  block_ads: true
  block_pvp: true
  stop_on_danger: true
  enforce_safe_actions: false

profiles:
  active: "default"
  items:
    default:
      name: "default"
      rois:
        party_marker: [0, 0, 1280, 720]
        room_open_big_icon: [0, 0, 1280, 720]
        door_search: [0, 0, 1280, 720]
        room_screen: [0, 0, 1280, 720]
        passage_screen: [0, 0, 1280, 720]
        event_screen: [0, 0, 1280, 720]
        mob: [0, 0, 1280, 720]
        boss: [0, 0, 1280, 720]
        loot: [0, 0, 1280, 720]
        exit: [0, 0, 1280, 720]
        auto_battle: [0, 0, 1280, 720]
        next_floor: [0, 0, 1280, 720]
        danger: [0, 0, 1280, 720]
      actions:
        exit_tap: [100, 100]
        auto_battle_tap: [1100, 650]
        next_floor_tap: [1180, 660]
      timings:
        after_room_enter_ms: 500
        after_exit_ms: 500
        after_next_floor_ms: 1000
        battle_settle_timeout_s: 120.0

progress:
  file: "./data/progress.json"

knowledge:
  rules_file: "./data/knowledge/rules.json"
  features_file: "./data/knowledge/features.json"

state:
  dir: "./data/state"
  floor_state_file_pattern: "floor_{floor_number}.json"

exploration:
  default_floor_from: 1
  default_floor_to: 100
  enter_all_doors: true
  skip_events_by_exit: true
  revisit_open_rooms: false
  max_attempts_per_door: 1

# добавлены по задаче как обязательные присутствующие ключи
# даже если текущий код их не читает напрямую

game:
  current_location: ""
  current_level: 1

debug:
  save_every_capture: false
  save_matched_frames: false
  annotate_matches: false
