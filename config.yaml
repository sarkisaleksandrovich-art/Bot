progress:
  # Путь к общему файлу прогресса исследования.
  file: "./data/progress.json"

knowledge:
  # Путь к rules.json с эталонами и правилами.
  rules_file: "./data/knowledge/rules.json"

  # Путь к features.json со служебными метаданными эталонов.
  features_file: "./data/knowledge/features.json"

state:
  # Папка, где будут храниться состояния этажей.
  dir: "./data/state"

  # Шаблон имени файла состояния этажа. {floor_number} подставляется кодом.
  floor_state_file_pattern: "floor_{floor_number}.json"

exploration:
  # Стартовый этаж по умолчанию, если его не передали через CLI.
  default_floor_from: 1

  # Последний этаж по умолчанию, если его не передали через CLI.
  default_floor_to: 10

  # Заходить во все найденные двери.
  enter_all_doors: true

  # Пропускать события через выход, не запускать их.
  skip_events_by_exit: true

  # Не возвращаться в уже открытые комнаты.
  revisit_open_rooms: false

  # Сколько раз максимум пытаться обработать одну дверь.
  max_attempts_per_door: 1

debug:
  # Сохранять каждый скриншот.
  save_every_capture: false

  # Сохранять кадры, где были найдены совпадения шаблонов.
  save_matched_frames: false

  # Рисовать отладочные рамки совпадений на сохранённых кадрах.
  annotate_matches: false
