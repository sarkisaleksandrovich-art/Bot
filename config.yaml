        swipe_start_x: null
        swipe_start_y: null
        swipe_end_x: null
        swipe_end_y: null
        swipe_duration_ms: 300
        swipe_step_limit: 0
        floor_templates: []

debug:
  # Сохранять ли сырые скриншоты без обработки.
  save_raw_screenshots: false

  # Сохранять ли примеры кадров для отладки стабилизации.
  save_stability_samples: false

  # Сохранять ли картинки с нарисованными совпадениями шаблонов.
  save_match_visualization: false

  # Тестовый режим без реальных действий.
  dry_run: false
