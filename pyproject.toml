[project]
name = "ldplayer_dungeon_explorer_bot_with_audit"
version = "0.1.0"
description = "ldplayer_dungeon_explorer_bot_with_audit using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.28,<2.0.0",
    "exa-py",
]

[project.scripts]
ldplayer_dungeon_explorer_bot_with_audit = "ldplayer_dungeon_explorer_bot_with_audit.main:run"
run_crew = "ldplayer_dungeon_explorer_bot_with_audit.main:run"
train = "ldplayer_dungeon_explorer_bot_with_audit.main:train"
replay = "ldplayer_dungeon_explorer_bot_with_audit.main:replay"
test = "ldplayer_dungeon_explorer_bot_with_audit.main:test"
run_with_trigger = "ldplayer_dungeon_explorer_bot_with_audit.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "bdfd43d1-d382-4695-bc66-64380cdc39f4"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
